[project]
name = "reposcout"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhanasekar", email = "www.tommytharun107@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docx2txt>=0.9",
    "fastapi>=0.165.0",
    "guardrails-ai>=0.11.0",
    "langchain[mcp]>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.16.1",
    "openai>=2.54.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
    "fastmcp>=4.2.5",
    "langchain-mcp-adapters>=0.3.1",
]

[project.scripts]
reposcout = "reposcout:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
